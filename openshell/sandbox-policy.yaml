version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    - /sandbox

landlock:
  compatibility: best_effort

network_policies:

  github_git:
    name: github-git
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/{{.Owner}}/{{.Repo}}.git/info/refs*"
          - allow:
              method: POST
              path: "/{{.Owner}}/{{.Repo}}.git/git-upload-pack"
          - allow:
              method: POST
              path: "/{{.Owner}}/{{.Repo}}.git/git-receive-pack"
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-http }

  github_api:
    name: github-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/repos/{{.Owner}}/{{.Repo}}"
          - allow:
              method: GET
              path: "/repos/{{.Owner}}/{{.Repo}}/**"
          - allow:
              method: POST
              path: "/repos/{{.Owner}}/{{.Repo}}/pulls"
          - allow:
              method: PATCH
              path: "/repos/{{.Owner}}/{{.Repo}}/pulls/*"
          - allow:
              method: POST
              path: "/repos/{{.Owner}}/{{.Repo}}/issues/*/comments"
          - allow:
              method: POST
              path: "/repos/{{.Owner}}/{{.Repo}}/pulls/*/reviews"
          - allow:
              method: DELETE
              path: "/repos/{{.Owner}}/{{.Repo}}/git/refs/**"
          - allow:
              method: GET
              path: "/user"
          - allow:
              method: GET
              path: "/user/**"
          - allow:
              method: GET
              path: "/rate_limit"
          - allow:
              method: GET
              path: "/app"
    binaries:
      - { path: /usr/local/bin/gh }
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-http }

  github_graphql:
    name: github-graphql
    endpoints:
      - host: api.github.com
        port: 443
        path: "/graphql"
        protocol: graphql
        enforcement: enforce
        rules:
          - allow:
              operation_type: query
          - allow:
              operation_type: mutation
              fields: [createPullRequest, updatePullRequest, addComment, addPullRequestReview, submitPullRequestReview, requestReviews, closePullRequest, reopenPullRequest, markPullRequestReadyForReview, convertPullRequestToDraft]
        deny_rules:
          - operation_type: mutation
            fields: [mergePullRequest, enablePullRequestAutoMerge]
    binaries:
      - { path: /usr/local/bin/gh }

  litellm_inference:
    name: litellm-inference
    endpoints:
      - host: litellm.internal.keener.us
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/python3.12 }
      - { path: /usr/bin/curl }

  npm_registry:
    name: npm-registry
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        allow_encoded_slash: true
        rules:
          - allow:
              method: GET
              path: "/**"
    binaries:
      - { path: /usr/local/bin/node }

  vertex_ai:
    name: vertex-ai
    endpoints:
      - host: global-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
      - host: us-central1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
      - host: us-east5-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
      - host: europe-west1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
      - host: oauth2.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/token"
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/node }

  anthropic_api:
    name: anthropic-api
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/node }

  claude_platform:
    name: claude-platform
    endpoints:
      - host: platform.claude.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/**"
          - allow:
              method: POST
              path: "/**"
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/node }

  claude_telemetry:
    name: claude-telemetry
    endpoints:
      - host: statsig.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
      - host: sentry.io
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/node }

  # opencode inference. Bound to the real opencode binary (a compiled release
  # binary, not a node script). The LiteLLM host mirrors litellm_inference; the
  # Anthropic rule serves --inference anthropic.
  opencode_litellm:
    name: opencode-litellm
    endpoints:
      - host: litellm.internal.keener.us
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
    binaries:
      - { path: /usr/local/bin/opencode }

  opencode_anthropic:
    name: opencode-anthropic
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
    binaries:
      - { path: /usr/local/bin/opencode }

  # Bootstrap egress for `mise install`. ALWAYS present at sandbox create time
  # and ALWAYS removed (policy update --remove-rule mise_bootstrap) before the
  # agent starts. Bound only to mise; its children (curl, tar, uv, ...) match
  # through the parent-process rule. Read-only methods (GET/HEAD/OPTIONS) only.
  # Extra hosts come from --mise-allow-host host[:port].
  mise_bootstrap:
    name: mise-bootstrap
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/*/*/releases/**"
          - allow:
              method: HEAD
              path: "/*/*/releases/**"
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/repos/*/*/releases"
          - allow:
              method: GET
              path: "/repos/*/*/releases/**"
          - allow:
              method: GET
              path: "/repos/*/*/tags"
          - allow:
              method: GET
              path: "/repos/*/*/git/ref/tags/**"
          - allow:
              method: GET
              path: "/repos/*/*/git/refs/tags/**"
      - host: objects.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: release-assets.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: mise-versions.jdx.dev
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: mise.jdx.dev
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        allow_encoded_slash: true
        access: read-only
      - host: dl.k8s.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: cdn.dl.k8s.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: get.helm.sh
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: storage.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      # Extra --mise-allow-host endpoints are expanded from the next line. It is a
      # YAML comment in the raw template (so tests/images/smoke.sh can parse the
      # file) and emits whole endpoints, each starting on a fresh line, at render time.
      #{{range .MiseExtraHosts}}{{printf "\n      - host: %s\n        port: %d\n        protocol: rest\n        enforcement: enforce\n        access: read-only" .Host .Port}}{{end}}
    binaries:
      - { path: /usr/local/bin/mise }
