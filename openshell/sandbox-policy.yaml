version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    - /sandbox

# hard_requirement: the sandbox fails to start if the kernel lacks Landlock or
# a path above cannot be restricted, instead of running with filesystem
# isolation silently degraded (best_effort only logs a warning).
landlock:
  compatibility: hard_requirement

network_policies:

  # Inference credentials: the inference provider profiles are endpointless too
  # (see the GitHub note below). Each api.anthropic.com / LiteLLM endpoint binds
  # the session's inference provider when one serving that host is attached,
  # and stays unbound otherwise (OpenShell refuses a binding to an unattached
  # provider). The binding is emitted from a YAML comment, like the mise hosts,
  # so the raw template still parses:
  #{{define "bind"}}{{with .}}{{printf "\n        credential_binding:\n          provider: %q" .}}{{end}}{{end}}

  # GitHub credentials: the github-agent provider profile is endpointless, so it
  # adds no rule of its own (a `_provider_*` rule would UNION with these and
  # reopen every repo). Instead every github.com / api.github.com endpoint below
  # binds the session's provider instance, which tells OpenShell where the token
  # placeholder may be resolved. OpenShell requires overlapping endpoints on one
  # host to agree on the binding, so mise_bootstrap's GitHub endpoints carry it too
  # (plus raw.githubusercontent.com, where only mise sends the token).
  github_git:
    name: github-git
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        credential_binding:
          provider: "{{.GitHubProvider}}"
        rules:
          - allow:
              method: GET
              path: "/{{.Owner}}/{{.Repo}}.git/info/refs*"
          - allow:
              method: POST
              path: "/{{.Owner}}/{{.Repo}}.git/git-upload-pack"
          - allow:
              method: POST
              path: "/{{.Owner}}/{{.Repo}}.git/git-receive-pack"
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-http }

  github_api:
    name: github-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        credential_binding:
          provider: "{{.GitHubProvider}}"
        rules:
          - allow:
              method: GET
              path: "/repos/{{.Owner}}/{{.Repo}}"
          - allow:
              method: GET
              path: "/repos/{{.Owner}}/{{.Repo}}/**"
          - allow:
              method: POST
              path: "/repos/{{.Owner}}/{{.Repo}}/pulls"
          - allow:
              method: PATCH
              path: "/repos/{{.Owner}}/{{.Repo}}/pulls/*"
          - allow:
              method: POST
              path: "/repos/{{.Owner}}/{{.Repo}}/issues/*/comments"
          - allow:
              method: POST
              path: "/repos/{{.Owner}}/{{.Repo}}/pulls/*/reviews"
          - allow:
              method: DELETE
              path: "/repos/{{.Owner}}/{{.Repo}}/git/refs/heads/agent/**"
          - allow:
              method: GET
              path: "/user"
          - allow:
              method: GET
              path: "/rate_limit"
          - allow:
              method: GET
              path: "/app"
    binaries:
      - { path: /usr/local/bin/gh }
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-http }

  github_graphql:
    name: github-graphql
    endpoints:
      - host: api.github.com
        port: 443
        path: "/graphql"
        protocol: graphql
        enforcement: enforce
        credential_binding:
          provider: "{{.GitHubProvider}}"
        rules:
          - allow:
              operation_type: query
          - allow:
              operation_type: mutation
              fields: [createPullRequest, updatePullRequest, addComment, addPullRequestReview, submitPullRequestReview, requestReviews, closePullRequest, reopenPullRequest, markPullRequestReadyForReview, convertPullRequestToDraft]
        deny_rules:
          - operation_type: mutation
            fields: [mergePullRequest, enablePullRequestAutoMerge]
    binaries:
      - { path: /usr/local/bin/gh }

  # Claude via LiteLLM (Anthropic Messages) and pi (pi-provider-litellm: model
  # discovery, then Messages, Chat Completions or Responses by route). Paths are
  # pinned as for anthropic_api below. Denied: /mcp (LiteLLM's MCP gateway
  # reaches other systems), key/user/team admin, spend logs, skills/plugins.
  litellm_inference:
    name: litellm-inference
    endpoints:
      - host: litellm.internal.keener.us
        port: 443
        protocol: rest
        enforcement: enforce
        #{{template "bind" .LiteLLMProvider}}
        rules:
          - allow:
              method: POST
              path: "/v1/messages"
          - allow:
              method: POST
              path: "/v1/messages/count_tokens"
          - allow:
              method: POST
              path: "/v1/chat/completions"
          - allow:
              method: POST
              path: "/v1/responses"
          - allow:
              method: GET
              path: "/model/info"
          - allow:
              method: GET
              path: "/v1/models"
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/node }

  npm_registry:
    name: npm-registry
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        allow_encoded_slash: true
        rules:
          - allow:
              method: GET
              path: "/**"
    binaries:
      - { path: /usr/local/bin/node }

  # Runtime PyPI access for uv/uvx (uv run, uv sync, uvx <tool>), the Python
  # counterpart of npm_registry. Read-only; UV_EXCLUDE_NEWER applies the cooldown.
  pypi_registry:
    name: pypi-registry
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/local/bin/uv }
      - { path: /usr/local/bin/uvx }

  vertex_ai:
    name: vertex-ai
    endpoints:
      - host: global-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
      - host: us-central1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
      - host: us-east5-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
      - host: europe-west1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/**"
          - allow:
              method: GET
              path: "/**"
      - host: oauth2.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/token"
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/node }

  # Inference rules allow only the paths harnesses were seen to use
  # (tests/l7-capture.sh). The credential is bound here, so a broader rule would
  # let the agent use it for anything the key can do: upload files, store
  # batches, read past results. Model listing is read-only metadata.
  anthropic_api:
    name: anthropic-api
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        #{{template "bind" .AnthropicProvider}}
        rules:
          - allow:
              method: POST
              path: "/v1/messages"
          - allow:
              method: POST
              path: "/v1/messages/count_tokens"
          - allow:
              method: GET
              path: "/v1/models"
          - allow:
              method: GET
              path: "/v1/models/*"
          - allow:
              method: GET
              path: "/api/claude_code/policy_limits"
          - allow:
              method: GET
              path: "/api/claude_code/settings"
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/node }

  claude_platform:
    name: claude-platform
    endpoints:
      - host: platform.claude.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/**"
          - allow:
              method: POST
              path: "/**"
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/node }

  # No claude_telemetry rule: agent-run sets
  # CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1, and sentry.io accepts events for
  # any project, so allowing it would be an open upload channel.

  # opencode inference. Bound to the real opencode binary (a compiled release
  # binary, not a node script). The LiteLLM host mirrors litellm_inference; the
  # Anthropic rule serves --inference anthropic.
  opencode_litellm:
    name: opencode-litellm
    endpoints:
      - host: litellm.internal.keener.us
        port: 443
        protocol: rest
        enforcement: enforce
        #{{template "bind" .LiteLLMProvider}}
        rules:
          - allow:
              method: POST
              path: "/chat/completions"
          - allow:
              method: POST
              path: "/v1/chat/completions"
          - allow:
              method: GET
              path: "/models"
          - allow:
              method: GET
              path: "/v1/models"
    binaries:
      - { path: /usr/local/bin/opencode }

  opencode_anthropic:
    name: opencode-anthropic
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        #{{template "bind" .AnthropicProvider}}
        rules:
          - allow:
              method: POST
              path: "/v1/messages"
          - allow:
              method: GET
              path: "/v1/models"
          - allow:
              method: GET
              path: "/v1/models/*"
    binaries:
      - { path: /usr/local/bin/opencode }

  # Bootstrap egress for `mise install`. ALWAYS present at sandbox create time
  # and ALWAYS removed (policy update --remove-rule mise_bootstrap) before the
  # agent starts. Bound only to mise; its children (curl, tar, uv, ...) match
  # through the parent-process rule. Read-only methods (GET/HEAD/OPTIONS) only.
  # Extra hosts come from --mise-allow-host host[:port].
  mise_bootstrap:
    name: mise-bootstrap
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        credential_binding:
          provider: "{{.GitHubProvider}}"
        rules:
          - allow:
              method: GET
              path: "/*/*/releases/**"
          - allow:
              method: HEAD
              path: "/*/*/releases/**"
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        credential_binding:
          provider: "{{.GitHubProvider}}"
        rules:
          - allow:
              method: GET
              path: "/repos/*/*/releases"
          - allow:
              method: GET
              path: "/repos/*/*/releases/**"
          - allow:
              method: GET
              path: "/repos/*/*/tags"
          - allow:
              method: GET
              path: "/repos/*/*/git/ref/tags/**"
          - allow:
              method: GET
              path: "/repos/*/*/git/refs/tags/**"
          # Provenance checks for lockfile entries with provenance =
          # "github-attestations": the attestation bundle for an artifact
          # digest, and the repo's metadata (public vs private picks the
          # Sigstore instance).
          - allow:
              method: GET
              path: "/repos/*/*/attestations/**"
          - allow:
              method: GET
              path: "/repos/*/*"
      # mise sends GITHUB_TOKEN to raw.githubusercontent.com too (aqua cosign
      # keys, github_content packages), so an unbound endpoint fails with
      # credential_endpoint_mismatch. The installation token is scoped to the
      # target repo and stays on a GitHub-operated host; read-only methods only.
      - host: raw.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        credential_binding:
          provider: "{{.GitHubProvider}}"
        rules:
          - allow:
              method: GET
              path: "/**"
          - allow:
              method: HEAD
              path: "/**"
      - host: objects.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: release-assets.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: mise-versions.jdx.dev
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: mise.jdx.dev
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        allow_encoded_slash: true
        access: read-only
      - host: dl.k8s.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: cdn.dl.k8s.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: get.helm.sh
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: storage.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      # Sigstore's public-good TUF root, which the attestation verification
      # needs to trust the signing certificates. Static public files, no token.
      - host: tuf-repo-cdn.sigstore.dev
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      # Extra --mise-allow-host endpoints are expanded from the next line. It is a
      # YAML comment in the raw template (so tests/images/smoke.sh can parse the
      # file) and emits whole endpoints, each starting on a fresh line, at render time.
      #{{range .MiseExtraHosts}}{{printf "\n      - host: %s\n        port: %d\n        protocol: rest\n        enforcement: enforce\n        access: read-only" .Host .Port}}{{end}}
    binaries:
      - { path: /usr/local/bin/mise }
