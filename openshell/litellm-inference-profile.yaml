id: litellm-inference
display_name: "LiteLLM Proxy (Homelab)"
description: "LiteLLM proxy inference provider — routes to Vertex AI via homelab cluster. Used by Claude Code, Pi and opencode."
category: inference
credentials:
  - name: litellm_api_key
    description: LiteLLM API key injected as x-api-key header (Claude Code)
    env_vars:
      - LITELLM_API_KEY
    required: true
    auth_style: header
    header_name: x-api-key
    query_param: ""
  - name: litellm_api_key_bearer
    description: LiteLLM API key injected as Authorization Bearer (Pi)
    env_vars:
      - LITELLM_API_KEY_BEARER
    required: false
    auth_style: bearer
    header_name: authorization
    query_param: ""
  - name: litellm_bearer_token
    description: LiteLLM bearer token for Max subscription header forwarding
    env_vars:
      - LITELLM_BEARER_TOKEN
    required: false
    auth_style: header
    header_name: x-litellm-api-key
    query_param: ""
endpoints:
  - host: litellm.internal.keener.us
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
# Real paths in the agent-* images (pi runs under node); see openshell/images/*/binaries.txt.
binaries:
  - /usr/local/bin/claude
  - /usr/local/bin/node
  - /usr/local/bin/opencode
  - /usr/bin/python3.12
  - /usr/bin/curl
inference_capable: true
