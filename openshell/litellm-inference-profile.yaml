id: litellm-inference
display_name: "LiteLLM Proxy (Homelab)"
description: "LiteLLM proxy inference provider — routes to Vertex AI via homelab cluster. Used by Claude Code, Pi and opencode. Credentials only; the per-session sandbox policy binds them to its LiteLLM endpoints."
category: inference
credentials:
  - name: litellm_api_key
    description: LiteLLM API key injected as x-api-key header (Claude Code)
    env_vars:
      - LITELLM_API_KEY
    required: true
    auth_style: header
    header_name: x-api-key
    query_param: ""
  - name: litellm_api_key_bearer
    description: LiteLLM API key injected as Authorization Bearer (Pi)
    env_vars:
      - LITELLM_API_KEY_BEARER
    required: false
    auth_style: bearer
    header_name: authorization
    query_param: ""
  - name: litellm_bearer_token
    description: LiteLLM bearer token for Max subscription header forwarding
    env_vars:
      - LITELLM_BEARER_TOKEN
    required: false
    auth_style: header
    header_name: x-litellm-api-key
    query_param: ""
# Credentials only, like github-agent-profile.yaml: profile endpoints would
# become a `_provider_*` rule that unions with the sandbox policy and reopens
# every path for every binary below. The per-session sandbox policy binds this
# provider to its LiteLLM endpoints (credential_binding) instead.
endpoints: []
# Inert without endpoints; kept so the profile lists the agent binaries that
# use it (real paths in the agent-* images; pi runs under node).
binaries:
  - /usr/local/bin/claude
  - /usr/local/bin/node
  - /usr/local/bin/opencode
inference_capable: true
