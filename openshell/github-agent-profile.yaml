id: github-agent
display_name: "GitHub Agent (Restricted)"
description: "Reusable GitHub provider for autonomous agents. Credential injection and endpoint routing only — repository-level authorization is enforced by the per-session sandbox policy and repo-scoped installation token."
category: source_control
credentials:
  - name: api_token
    description: GitHub App installation token (repo-scoped)
    env_vars:
      - GITHUB_TOKEN
      - GH_TOKEN
    required: true
    auth_style: bearer
    header_name: authorization
    query_param: ""
endpoints:
  # REST API
  - host: api.github.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      # Repository operations (scoped by sandbox policy)
      - allow:
          method: GET
          path: /repos/**
      - allow:
          method: POST
          path: /repos/**/pulls
      - allow:
          method: PATCH
          path: /repos/**/pulls/*
      - allow:
          method: POST
          path: /repos/**/issues/*/comments
      - allow:
          method: POST
          path: /repos/**/pulls/*/reviews
      - allow:
          method: DELETE
          path: /repos/**/git/refs/**

      # User identity
      - allow:
          method: GET
          path: /user
      - allow:
          method: GET
          path: /user/**

      # Rate limit
      - allow:
          method: GET
          path: /rate_limit

      # App identity
      - allow:
          method: GET
          path: /app

  # GraphQL API — read-only queries, restricted mutations
  - host: api.github.com
    port: 443
    protocol: graphql
    access: read-only
    enforcement: enforce
    path: /graphql

  # Git Smart HTTP (repo scoping enforced by sandbox policy)
  - host: github.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow:
          method: GET
          path: /**
      - allow:
          method: HEAD
          path: /**
      - allow:
          method: OPTIONS
          path: /**
      - allow:
          method: POST
          path: /**/git-upload-pack
      - allow:
          method: POST
          path: /**/git-receive-pack

# Real paths in the agent-* images; see openshell/images/*/binaries.txt.
binaries:
  - /usr/local/bin/gh
  - /usr/bin/git
  - /usr/lib/git-core/git-remote-http
inference_capable: false
