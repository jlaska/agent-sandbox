id: github-agent
display_name: "GitHub Agent (Restricted)"
description: "Reusable GitHub provider for autonomous agents. Credentials only; the per-session sandbox policy binds them to its repo-scoped GitHub endpoints."
category: source_control
credentials:
  - name: api_token
    description: GitHub App installation token (repo-scoped)
    env_vars:
      - GITHUB_TOKEN
      - GH_TOKEN
    required: true
    auth_style: bearer
    header_name: authorization
    query_param: ""
# Endpointless on purpose. Profile endpoints become a `_provider_*` network rule
# that UNIONS with the sandbox policy, and a generic profile cannot be scoped to
# one repository, so any endpoints here would reopen every repo the token can
# reach. The sandbox policy binds this provider on its own per-repo GitHub
# endpoints instead (credential_binding in openshell/sandbox-policy.yaml).
# `endpoints: []` is explicit so agent-run's profile reconciliation replaces an
# older import that still has endpoints.
endpoints: []

# Real paths in the agent-* images; see openshell/images/*/binaries.txt. Binaries
# only feed a `_provider_*` rule, which an endpointless profile does not create,
# so these document intent; the sandbox policy decides which binaries reach GitHub.
binaries:
  - /usr/local/bin/gh
  - /usr/bin/git
  - /usr/lib/git-core/git-remote-http
inference_capable: false
