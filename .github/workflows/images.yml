name: Images

# Builds, smoke-tests and (on main only) publishes the per-harness sandbox images.
# Podman only (decision D16): no docker/buildx/bake actions. The GitHub-hosted ubuntu-* runner
# images (amd64 and -arm) ship Podman preinstalled; see each image's readme, linked from:
#   https://github.com/actions/runner-images#available-images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'openshell/images/**'
      - 'openshell/sandbox-policy.yaml'
      - 'tests/images/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:
    inputs:
      harnesses:
        description: 'Harnesses to build: all, or a comma-separated subset of claude,pi,opencode'
        required: false
        default: 'all'
        type: string

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/jlaska

jobs:
  detect:
    name: Detect changed harnesses
    runs-on: ubuntu-26.04
    outputs:
      any: ${{ steps.detect.outputs.any }}
      harnesses: ${{ steps.detect.outputs.harnesses }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select harnesses
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_INPUT: ${{ inputs.harnesses }}
        run: |
          set -euo pipefail
          all="claude pi opencode"
          selected=""
          add() { case " $selected " in *" $1 "*) ;; *) selected="$selected $1" ;; esac; }
          add_all() { for h in $all; do add "$h"; done; }

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            req="$(printf '%s' "${DISPATCH_INPUT:-all}" | tr ',' ' ')"
            for h in ${req:-all}; do
              case "$h" in
                all) add_all ;;
                claude | pi | opencode) add "$h" ;;
                *) echo "::error::unknown harness '$h' (want all, claude, pi, opencode)"; exit 1 ;;
              esac
            done
          else
            base=""
            [ "$EVENT_NAME" = pull_request ] && base="$PR_BASE_SHA"
            [ "$EVENT_NAME" = push ] && base="$PUSH_BEFORE_SHA"
            if [ -z "$base" ] || [ -z "${base//0/}" ] || ! git cat-file -e "$base^{commit}" 2> /dev/null; then
              echo "no usable base commit; building all harnesses"
              add_all
            else
              echo "changed files vs $base:"
              git diff --name-only "$base" HEAD | tee /dev/stderr | while IFS= read -r f; do
                case "$f" in
                  openshell/images/claude/*) echo claude ;;
                  openshell/images/pi/*) echo pi ;;
                  openshell/images/opencode/* | openshell/images/refresh-checksums.sh) echo opencode ;;
                  openshell/images/* | openshell/sandbox-policy.yaml | tests/images/* | .github/workflows/images.yml) echo all ;;
                esac
              done > "$RUNNER_TEMP/hits"
              while IFS= read -r h; do
                if [ "$h" = all ]; then add_all; else add "$h"; fi
              done < "$RUNNER_TEMP/hits"
            fi
          fi

          # Stable order; JSON for the matrices.
          ordered=""
          for h in $all; do case " $selected " in *" $h "*) ordered="$ordered $h" ;; esac; done
          # shellcheck disable=SC2086  # $ordered is a space-separated word list on purpose
          harnesses="$(printf '%s\n' $ordered | jq -R . | jq -sc .)"
          # shellcheck disable=SC2086
          matrix="$(printf '%s\n' $ordered | jq -R . | jq -sc '
            [ .[] as $h
              | {runner: "ubuntu-26.04", arch: "amd64"},
                {runner: "ubuntu-26.04-arm", arch: "arm64"}
              | {harness: $h} + . ] | {include: .}')"
          echo "selected harnesses:${ordered:- (none)}"
          {
            echo "any=$([ -n "$ordered" ] && echo true || echo false)"
            echo "harnesses=$harnesses"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.harness }} (${{ matrix.arch }})
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check opencode checksums
        if: matrix.harness == 'opencode'
        run: |
          if ! ./openshell/images/refresh-checksums.sh --check; then
            echo "::error title=opencode checksums out of date::OPENCODE_VERSION changed without refreshing OPENCODE_SHA256_AMD64/ARM64. Run ./openshell/images/refresh-checksums.sh and commit the result (expected digests are printed above)."
            exit 1
          fi

      # smoke.sh parses sandbox-policy.yaml on the host with `uv run --with pyyaml`.
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: '0.13.5'
          enable-cache: false

      - name: Podman version
        run: podman --version

      - name: Build
        run: make image-${{ matrix.harness }}

      - name: Smoke test
        run: make smoke HARNESSES=${{ matrix.harness }}

      # Only main publishes. The image is handed to the publish job (which alone holds
      # packages: write) as a docker-archive, so this job never needs registry credentials.
      - name: Save image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: podman save --format docker-archive -o "$RUNNER_TEMP/image.tar" localhost/agent-${{ matrix.harness }}:local

      - name: Upload image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.harness }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Push ${{ matrix.harness }} (${{ matrix.arch }})
    needs: [detect, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.harness }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Pushed under a per-arch staging tag only to give the blob a name; consumers and the
      # manifest list reference it by digest, and the release tags are applied by `merge`.
      - name: Push by digest
        env:
          H: ${{ matrix.harness }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          podman load -i "$RUNNER_TEMP/image/image.tar"
          repo="$REGISTRY/agent-$H"
          podman push --digestfile "$RUNNER_TEMP/digest" \
            "localhost/agent-$H:local" "docker://$repo:ci-${GITHUB_SHA::7}-$ARCH"
          echo "pushed $repo@$(cat "$RUNNER_TEMP/digest") ($ARCH)"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/digest" "$RUNNER_TEMP/out/$ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.harness }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Merge ${{ matrix.harness }}
    needs: [detect, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.detect.outputs.harnesses) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.harness }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Create and push manifest list
        env:
          H: ${{ matrix.harness }}
        run: |
          set -euo pipefail
          repo="$REGISTRY/agent-$H"
          ver="$(./openshell/images/version.sh "$H")"
          stamp="$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          list="localhost/agent-$H-list"
          podman manifest create "$list"
          for arch in amd64 arm64; do
            podman manifest add "$list" "docker://$repo@$(cat "$RUNNER_TEMP/digests/$arch")"
          done
          for tag in "$ver" "$ver-$stamp"; do
            podman manifest push --all --digestfile "$RUNNER_TEMP/list-digest" "$list" "docker://$repo:$tag"
            digest="$(cat "$RUNNER_TEMP/list-digest")"
            echo "pushed $repo:$tag -> $digest"
            {
              echo "### agent-$H $tag"
              echo
              echo "- digest: \`$digest\`"
              echo "- ref: \`$repo:$tag@$digest\`"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
